name: Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-m0-ring:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Ring copy/underrun and modulator math
      run: make -C luckfox-lyra/picocalc_m0_audio_fw check

  check-m0-firmware:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install toolchain and emulator
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
        pip install unicorn pyelftools
    - name: Build firmware
      run: make -C luckfox-lyra/picocalc_m0_audio_fw
    - name: Run the playback loop in the emulator
      run: make -C luckfox-lyra/picocalc_m0_audio_fw check-emu
    - name: Build profiling variant
      run: make -C luckfox-lyra/picocalc_m0_audio_fw -B PROFILE=1
    - name: Build diagnostic firmware and reader tool
      run: |
        make -C luckfox-lyra/picocalc_m0_diag_fw
        make -C luckfox-lyra/picocalc_m0_diag_fw m0diag
    - name: Run the diagnostic firmware in the emulator
      run: make -C luckfox-lyra/picocalc_m0_diag_fw check-emu

  build-drivers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout driver sources
      uses: actions/checkout@v4
      with:
        path: picocalc-drivers
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          device-tree-compiler \
          flex \
          libssl-dev \
          libelf-dev \
          kmod \
          cpio \
          rsync \
          git \
          wget \
          debhelper \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf
    
    - name: Checkout Linux kernel sources
      uses: actions/checkout@v4
      with:
        repository: Calculinux/luckfox-linux-6.1-rk3506
        ref: e0846929f1a797988a6965268f391fdb779becfc
        path: linux
        fetch-depth: 1
    
    - name: Cache kernel build
      id: cache-kernel
      uses: actions/cache@v4
      with:
        path: linux
        key: kernel-build-${{ runner.os }}-e0846929f1a797988a6965268f391fdb779becfc-${{ hashFiles('picocalc-drivers/.github/workflows/build-test.yml') }}
        restore-keys: |
          kernel-build-${{ runner.os }}-e0846929f1a797988a6965268f391fdb779becfc-
    
    - name: Configure kernel
      if: steps.cache-kernel.outputs.cache-hit != 'true'
      working-directory: linux
      run: |
        # Use the Luckfox defconfig as base
        make ARCH=arm rk3506_luckfox_defconfig
        
        # Enable PicoCalc drivers in the config
        # These would normally be enabled by kernel config fragments
        scripts/config --enable CONFIG_STAGING
        scripts/config --enable CONFIG_STAGING_PICOCALC
        scripts/config --module CONFIG_PICOCALC_KBD
        scripts/config --module CONFIG_PICOCALC_LCD_FB
        scripts/config --module CONFIG_PICOCALC_LCD_DRM
        scripts/config --module CONFIG_PICOCALC_SND_PWM
        scripts/config --module CONFIG_PICOCALC_SND_SOFT_PWM
        scripts/config --module CONFIG_PICOCALC_MFD
        scripts/config --module CONFIG_PICOCALC_MFD_BMS
        scripts/config --module CONFIG_PICOCALC_MFD_BKL
        scripts/config --module CONFIG_PICOCALC_MFD_KBD
        scripts/config --module CONFIG_PICOCALC_MFD_LED
        scripts/config --module CONFIG_PICOCALC_RK3506_RPROC
        scripts/config --module CONFIG_PICOCALC_SND_M0
        
        # Update config with dependencies
        make ARCH=arm olddefconfig
    
    - name: Prepare kernel build
      if: steps.cache-kernel.outputs.cache-hit != 'true'
      working-directory: linux
      run: |
        # Prepare the kernel build (modules_prepare target)
        # This generates necessary files for out-of-tree module builds
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare -j$(nproc)
    
    - name: Build PicoCalc drivers
      working-directory: picocalc-drivers
      run: |
        # Build all drivers against the prepared kernel
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- KERNEL_SRC=$(pwd)/../linux all -j$(nproc)

    - name: Validate device tree overlays
      working-directory: picocalc-drivers
      run: |
        KERNEL_INCLUDE="$(pwd)/../linux/include"
        KERNEL_DTS_INCLUDE="$(pwd)/../linux/arch/arm/boot/dts"
        KERNEL_DTS_INCLUDE_COMMON="${KERNEL_DTS_INCLUDE}/include"
        compiled=0
        for f in overlays/*-overlay.dts luckfox-lyra/overlays/*-overlay.dts; do
          [ -f "$f" ] || continue
          echo "==> $f"
          base=$(basename "$f" .dts)
          cpp -nostdinc \
            -I"${KERNEL_INCLUDE}" \
            -I"${KERNEL_DTS_INCLUDE}" \
            -I"${KERNEL_DTS_INCLUDE_COMMON}" \
            -undef -D__DTS__ -x assembler-with-cpp \
            "$f" > "/tmp/${base}.pp.dts"
          dtc -@ -I dts -O dtb -o "/tmp/${base}.dtbo" "/tmp/${base}.pp.dts"
          compiled=$((compiled + 1))
        done
        if [ "$compiled" -eq 0 ]; then
          echo "ERROR: no overlay sources compiled"
          exit 1
        fi
        echo "Compiled $compiled overlay(s)"

    - name: Verify driver modules
      working-directory: picocalc-drivers
      run: |
        # Keep in sync with Makefile SUBDIRS / Yocto picocalc-drivers_1.0.bb.
        expected="
          drivers/picocalc_kbd/picocalc_kbd.ko
          drivers/picocalc_lcd_fb/ili9488_fb.ko
          drivers/picocalc_lcd_drm/ili9488_drm.ko
          drivers/picocalc_snd-pwm/picocalc_snd_pwm.ko
          drivers/picocalc_snd-softpwm/picocalc_snd_softpwm.ko
          drivers/picocalc_mfd/picocalc_mfd.ko
          drivers/picocalc_mfd_bms/picocalc_mfd_bms.ko
          drivers/picocalc_mfd_bkl/picocalc_mfd_bkl.ko
          drivers/picocalc_mfd_kbd/picocalc_mfd_kbd.ko
          drivers/picocalc_mfd_led/picocalc_mfd_led.ko
          luckfox-lyra/drivers/picocalc_rk3506_rproc/rk3506_rproc.ko
          luckfox-lyra/drivers/picocalc_snd-m0/picocalc_snd_m0.ko
        "
        missing=0
        for ko in $expected; do
          if [ -f "$ko" ]; then
            echo "OK $ko"
          else
            echo "ERROR: missing $ko"
            missing=1
          fi
        done
        echo "Built .ko files:"
        find . -name "*.ko" -type f | sort
        if [ "$missing" -ne 0 ]; then
          echo "ERROR: expected modules were not all built"
          exit 1
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: picocalc-driver-modules
        path: picocalc-drivers/**/*.ko
        retention-days: 7
